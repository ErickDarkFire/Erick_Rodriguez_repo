name: Selenium Tests With Behave

on:
  pull_request:
  push:
    branches: [main]

jobs:
  selenium-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip xvfb
          # Descarga la versión estable oficial
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt install -y ./google-chrome-stable_current_amd64.deb

      - name: Install dependencies
        run: |
          python -m pip install behave selenium webdriver-manager
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run tests
        working-directory: ./selenium
        run: |
          # xvfb-run maneja la pantalla virtual para que Chrome no necesite --headless
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python -m behave
